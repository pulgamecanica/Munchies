# On a v* tag (made by `make release`): publish a Forgejo Release with the source code as a zip.
# Uses the job's automatic token; if your instance restricts it, add a RELEASE_TOKEN secret (scope: write:repository).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source zip and notes
        run: |
          TAG="$GITHUB_REF_NAME"
          git archive --format=zip --prefix="munchies-$TAG/" -o "munchies-$TAG-source.zip" "$TAG"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          { echo "## Changes"; if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..$TAG"; else git log --no-merges --pretty='- %s' "$TAG"; fi; } > notes.md
          echo "TITLE=$TAG: $(make -s release-name)" >> "$GITHUB_ENV"
      - name: Publish
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          BODY=$(node -e 'const fs=require("fs");process.stdout.write(JSON.stringify({tag_name:process.env.GITHUB_REF_NAME,name:process.env.TITLE,body:fs.readFileSync("notes.md","utf8")}))')
          ID=$(curl -fsS -X POST "$API/releases" -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d "$BODY" | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -fsS -X POST "$API/releases/$ID/assets?name=munchies-$GITHUB_REF_NAME-source.zip" -H "Authorization: token $TOKEN" -F "attachment=@munchies-$GITHUB_REF_NAME-source.zip" > /dev/null
          echo "Released $GITHUB_REF_NAME (id $ID)"
