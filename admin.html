<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepees Admin</title>
<style>
  :root { color-scheme: light;
    --bg: #f7f8f4; --card: #ffffff; --cell: #eef1f8; --line: #d9deec; --ink: #151a33; --muted: #5b6182;
    --accent: #1e3fd0; --accent-ink: #fff; --tomato: #ee3b24; --butter: #ffd43b;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #12152b; --card: #1a1e3a; --cell: #232850; --line: #2f3566; --ink: #f2f0e6; --muted: #a3a8c8;
      --accent: #7d95ff; --accent-ink: #0e1126; --tomato: #ff5a3d;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 900; letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
  section, form.login { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
  input, select, textarea { font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 7px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--tomato); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  /* number fields: our own − / + stepper instead of the browser's spinner arrows */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
  .stepper:focus-within { border-color: var(--accent); }
  .stepper input { width: 56px; border: 0; border-radius: 0; background: none; padding: 7px 2px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stepper button { width: 32px; height: 36px; padding: 0; border: 0; border-radius: 0; background: var(--cell); font-size: 18px; line-height: 1; }
  .stepper button:hover { background: var(--accent); color: var(--accent-ink); }
  /* KPI tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .tile b { display: block; font-size: 30px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13.5px; }
  /* chart */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: var(--line); stroke-width: 1; }
  .chart .axis text { fill: var(--muted); font-size: 11px; }
  .chart .hit { fill: transparent; }
  .chart .col:hover .hit { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.4; min-width: 140px; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; z-index: 2; }
  .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .tip b { float: right; margin-left: 14px; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-top: 10px; }
  /* tags */
  .ticon { display: inline-block; width: 26px; height: 26px; background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .tags-grid { display: grid; gap: 10px; }
  .tag { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: start; border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
  .tag .names { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
  .tag .names input { width: 100%; padding: 5px 8px; font-size: 13.5px; }
  .tag textarea { width: 100%; min-height: 54px; font: 12px/1.4 ui-monospace, monospace; margin-top: 6px; }
  .tag .id { font-weight: 700; } .tag .src { font-size: 12px; color: var(--muted); }
  .note { font-size: 13.5px; color: var(--muted); margin: 6px 0 12px; }
  /* AI models: the fallback chain */
  .chain { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: c; }
  .mcard { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
  .mcard.off { opacity: .6; }
  .mcard .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .mcard .head b { font-size: 16px; }
  .mcard .pos { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--cell); font-weight: 800; font-size: 13px; }
  .pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--cell); color: var(--muted); }
  .pill.ok { background: color-mix(in srgb, var(--s3) 18%, transparent); color: var(--s3); }
  .pill.bad { background: color-mix(in srgb, var(--tomato) 16%, transparent); color: var(--tomato); }
  .pill.free { background: color-mix(in srgb, var(--s4) 20%, transparent); color: var(--s4); }
  .fields { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
  .fields label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .fields label.check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); align-self: center; }
  .fields input:not([type=checkbox]) { width: 110px; padding: 5px 8px; }
  .fields input.wide { width: 240px; } .fields input.url { width: 320px; max-width: 100%; }
  .bar { height: 8px; border-radius: 999px; background: var(--cell); overflow: hidden; min-width: 140px; flex: 1; max-width: 260px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .bar.full i { background: var(--tomato); }
  .err { font-size: 12.5px; color: var(--tomato); white-space: normal; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1>Admin center</h1>
  <p class="sub">Usage, AI models and budgets, member limits and stock tags. Members, plans, Stripe and posts live in <a href="/ghost/">Ghost admin</a>.</p>
  <form class="login row" id="f"><input id="t" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" aria-label="Admin token"><button class="primary">Load</button></form>
  <div id="out"></div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
  const say = (m) => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2500); };
  try { $('#t').value = sessionStorage.getItem('rt-admin') || ''; } catch {}
  const call = (path, method = 'GET', body) => fetch(path, { method, headers: { authorization: 'Bearer ' + $('#t').value, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined })
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; });

  const KINDS = [['convert', 'Create a recipe'], ['generate', 'Cook from stock'], ['recognize', 'Stock photo'], ['translate', 'Translate'], ['sort', 'Sort stock'], ['ocr', 'OCR (free)']];
  const LANGS = ['en', 'es', 'fr', 'pt', 'it', 'de'];
  const MODES = { off: 'Off: no AI tagging', assign: 'AI assigns existing tags', create: 'AI assigns and may create new tags (with icons)' };
  const stepper = (name, v, label) => `<span class="stepper"><button type="button" data-step="-1" aria-label="${esc(label)}: one less">−</button><input type="number" min="0" inputmode="numeric" name="${name}" value="${v}" aria-label="${esc(label)}"><button type="button" data-step="1" aria-label="${esc(label)}: one more">+</button></span>`;
  const icon = (svg) => `<span class="ticon" aria-hidden="true" style="${esc(`--icon:url("data:image/svg+xml,${encodeURIComponent(svg)}")`)}"></span>`;

  function chart(st) {
    // 30 days, stacked by kind, fixed colour order (series 1..6); hover a day for the breakdown.
    const days = [...Array(30)].map((_, i) => new Date(Date.parse(st.since) + i * 864e5).toISOString().slice(0, 10));
    const by = {}; for (const e of st.days) (by[e.day] ||= {})[e.kind] = e.n;
    const tot = (d) => KINDS.reduce((a, [k]) => a + ((by[d] || {})[k] || 0), 0);
    const max = Math.max(4, ...days.map(tot));
    const step = Math.ceil(max / 4), top = step * 4;
    const W = 720, H = 220, L = 32, B = 22, cw = (W - L) / 30, bw = Math.max(6, cw - 6);
    const y = (v) => H - B - (v / top) * (H - B - 8);
    const grid = [0, 1, 2, 3, 4].map((i) => `<line x1="${L}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/>`).join('');
    const ticks = [0, 1, 2, 3, 4].map((i) => `<text x="${L - 6}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`).join('');
    const labels = days.map((d, i) => (i % 5 === 0 || i === 29) ? `<text x="${L + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${d.slice(5).replace('-', '/')}</text>` : '').join('');
    const cols = days.map((d, i) => {
      let acc = 0; const x = L + i * cw + (cw - bw) / 2;
      const segs = KINDS.map(([k], si) => {
        const v = (by[d] || {})[k] || 0; if (!v) return '';
        const y0 = y(acc), y1 = y(acc + v); acc += v;
        const last = acc === tot(d);
        // 2px surface gap between segments; rounded top on the last segment only
        return `<path fill="var(--s${si + 1})" stroke="var(--card)" stroke-width="2" d="${last
          ? `M${x},${y0} V${y1 + 4} Q${x},${y1} ${x + 4},${y1} H${x + bw - 4} Q${x + bw},${y1} ${x + bw},${y1 + 4} V${y0} Z`
          : `M${x},${y0} V${y1} H${x + bw} V${y0} Z`}"/>`;
      }).join('');
      return `<g class="col" data-day="${d}"><rect class="hit" x="${L + i * cw}" y="0" width="${cw}" height="${H - B}"/>${segs}</g>`;
    }).join('');
    const totals = KINDS.map(([k, n], si) => ({ k, n, si, v: st.days.filter((e) => e.kind === k).reduce((a, e) => a + e.n, 0) }));
    return `
      <div class="chart" id="chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="AI uses per day for the last 30 days, stacked by feature">
          <g class="grid">${grid}</g><g class="axis">${ticks}${labels}</g>${cols}
        </svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <ul class="legend">${KINDS.map(([k, n], si) => `<li><i style="background:var(--s${si + 1})"></i>${esc(n)}</li>`).join('')}</ul>
      <details><summary>Show as a table</summary>
        <table><thead><tr><th>Feature</th><th class="n">Last 30 days</th></tr></thead>
        <tbody>${totals.map((x) => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;background:var(--s${x.si + 1})"></span>${esc(x.n)}</td><td class="n">${x.v}</td></tr>`).join('')}</tbody></table>
      </details>`;
    function hover() {}
  }
  function wireChart(st) {
    const el = $('#chart'), tip = $('#tip');
    const by = {}; for (const e of st.days) (by[e.day] ||= {})[e.kind] = e.n;
    el.addEventListener('mousemove', (e) => {
      const g = e.target.closest('.col'); if (!g) { tip.hidden = true; return; }
      const d = g.dataset.day, rows = KINDS.map(([k, n], si) => [n, (by[d] || {})[k] || 0, si]).filter((r) => r[1]);
      const box = el.getBoundingClientRect(), r = g.querySelector('.hit').getBoundingClientRect();
      tip.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${d}</div>` + (rows.length ? rows.map(([n, v, si]) => `<div><i style="background:var(--s${si + 1})"></i>${esc(n)}<b>${v}</b></div>`).join('') : '<div>No AI use</div>');
      tip.style.left = (r.left - box.left + r.width / 2) + 'px'; tip.style.top = (e.clientY - box.top) + 'px'; tip.hidden = false;
    });
    el.addEventListener('mouseleave', () => { tip.hidden = true; });
  }

  /* ---------- AI providers & models ---------- */
  let AI = null;
  const PRESETS = {
    anthropic: ['Anthropic', 'anthropic', 'https://api.anthropic.com'], openai: ['OpenAI', 'openai', 'https://api.openai.com/v1'],
    openrouter: ['OpenRouter', 'openai', 'https://openrouter.ai/api/v1'], gemini: ['Google Gemini', 'openai', 'https://generativelanguage.googleapis.com/v1beta/openai'],
    groq: ['Groq', 'openai', 'https://api.groq.com/openai/v1'], mistral: ['Mistral', 'openai', 'https://api.mistral.ai/v1'], ollama: ['Ollama (self-hosted)', 'openai', 'http://ollama:11434/v1'],
  };
  const money = (v) => '$' + (Number(v) || 0).toFixed(v >= 100 ? 0 : 2);
  const per = { day: 'today', week: 'this week', month: 'this month' };
  const periodSel = (v) => `<select name="period">${AI.periods.map((x) => `<option value="${x}"${x === v ? ' selected' : ''}>per ${x}</option>`).join('')}</select>`;
  const spendBar = (spent, max) => max == null ? '' : `<span class="bar${spent >= max ? ' full' : ''}" title="${money(spent)} of ${money(max)}"><i style="width:${Math.min(100, max ? (spent / max) * 100 : 100)}%"></i></span>`;
  const modelFields = (m) => `
    <label>Model id<input class="wide" name="model" value="${esc(m.model || '')}" placeholder="claude-sonnet-5-5" required></label>
    <label>$ / 1M in<input name="price_in" type="number" step="any" min="0" value="${m.price_in ?? ''}" placeholder="0 = free"></label>
    <label>$ / 1M out<input name="price_out" type="number" step="any" min="0" value="${m.price_out ?? ''}" placeholder="0 = free"></label>
    <label>Budget $<input name="budget" type="number" step="any" min="0" value="${m.budget ?? ''}" placeholder="no limit"></label>
    <label>Max calls<input name="max_calls" type="number" step="1" min="0" value="${m.max_calls ?? ''}" placeholder="no limit"></label>
    <label>Limits reset${periodSel(m.period || 'month')}</label>
    <label class="check"><input type="checkbox" name="vision"${m.vision !== 0 ? ' checked' : ''}> Reads images</label>
    <label class="check"><input type="checkbox" name="enabled"${m.enabled !== 0 ? ' checked' : ''}> On</label>`;
  function aiSection(ai) {
    const prov = (id) => ai.providers.find((p) => p.id === id);
    const b = ai.budget;
    return `<section>
      <h2>AI models</h2>
      <p class="note">Every AI request tries these models <b>top to bottom</b> and uses the first one that is on, isn't cooling down after a rate limit or outage, and is under its budget and call limit. If a model fails or gives an unusable answer, the next one takes over. Free models (both prices 0) ignore budgets, so they make a good last resort. Spend is counted from each reply's real token usage.</p>
      <form class="fields" data-ai="budget" style="margin-bottom:14px">
        <label>Total budget, all paid models $<input name="amount" type="number" step="any" min="0" value="${b.amount ?? ''}" placeholder="no limit"></label>
        <label>Resets${periodSel(b.period)}</label>
        <button class="primary">Save</button>
        <span class="muted">${money(b.spent)} spent ${per[b.period]}${b.amount != null ? ` of ${money(b.amount)}` : ''}</span>${spendBar(b.spent, b.amount)}
      </form>
      <ol class="chain">${ai.models.map((m, i) => `
        <li><form class="mcard${m.enabled ? '' : ' off'}" data-ai="model" data-id="${m.id}">
          <div class="head">
            <span class="pos">${i + 1}</span><b>${esc(m.model)}</b><span class="muted">${esc(prov(m.provider)?.name || '?')}</span>
            ${m.free ? '<span class="pill free">free</span>' : ''}
            <span class="pill ${m.blocked ? 'bad' : 'ok'}">${esc(m.blocked || 'ready')}</span>
            <span class="muted">${m.calls} calls, ${money(m.spent)} ${per[m.period]}${m.budget != null && !m.free ? ` of ${money(m.budget)}` : ''}</span>${m.free ? '' : spendBar(m.spent, m.budget)}
          </div>
          ${m.last_error ? `<div class="err">Last error: ${esc(m.last_error)}</div>` : ''}
          <div class="fields">${modelFields(m)}</div>
          <div class="row">
            <button type="button" data-ai-act="up" ${i ? '' : 'disabled'} aria-label="Move up">↑</button><button type="button" data-ai-act="down" ${i < ai.models.length - 1 ? '' : 'disabled'} aria-label="Move down">↓</button>
            <button class="primary">Save</button><button type="button" data-ai-act="test">Test</button><button type="button" class="danger" data-ai-act="del-model">Remove</button>
          </div>
        </form></li>`).join('') || '<li class="muted">No models yet: add a provider, then a model.</li>'}</ol>
      ${ai.providers.length ? `<h3>Add a model</h3>
      <form class="mcard" data-ai="model-new">
        <div class="fields"><label>Provider<select name="provider">${ai.providers.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>${modelFields({ enabled: 1, vision: 1, period: 'month' })}</div>
        <div class="row"><button class="primary">Add to the end of the chain</button></div>
      </form>` : ''}
      <h3>Providers</h3>
      <p class="note">"OpenAI-compatible" covers OpenAI, OpenRouter, Google Gemini, Groq, Mistral and self-hosted Ollama or LM Studio. Keys are stored encrypted with the server's <code>SECRET_KEY</code> and never shown again; leave the key empty to keep the current one.</p>
      ${ai.secret ? '' : '<p class="err"><b>SECRET_KEY is not set on the server</b>, so API keys can\'t be saved here. Set it (e.g. <code>openssl rand -hex 32</code>) and restart, or leave the key empty to use ANTHROPIC_API_KEY / OPENAI_API_KEY from the environment.</p>'}
      <div class="chain">${ai.providers.map((p) => `
        <form class="mcard" data-ai="provider" data-id="${p.id}"><div class="fields">
          <label>Name<input name="name" value="${esc(p.name)}"></label>
          <label>Type<select name="kind">${ai.kinds.map((k) => `<option value="${k}"${k === p.kind ? ' selected' : ''}>${k === 'openai' ? 'OpenAI-compatible' : 'Anthropic'}</option>`).join('')}</select></label>
          <label>Base URL<input class="url" name="base_url" value="${esc(p.base_url)}"></label>
          <label>API key<input class="wide" name="api_key" type="password" autocomplete="off" placeholder="${esc(p.key || 'none')}"></label>
          <button class="primary">Save</button><button type="button" class="danger" data-ai-act="del-provider">Delete</button>
        </div></form>`).join('')}
        <form class="mcard" data-ai="provider-new"><div class="fields">
          <label>Preset<select name="preset"><option value="">Choose…</option>${Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${esc(v[0])}</option>`).join('')}</select></label>
          <label>Name<input name="name" placeholder="OpenRouter"></label>
          <label>Type<select name="kind">${ai.kinds.map((k) => `<option value="${k}">${k === 'openai' ? 'OpenAI-compatible' : 'Anthropic'}</option>`).join('')}</select></label>
          <label>Base URL<input class="url" name="base_url" placeholder="https://…" required></label>
          <label>API key<input class="wide" name="api_key" type="password" autocomplete="off" placeholder="sk-…"></label>
          <button class="primary">Add provider</button>
        </div></form>
      </div>
    </section>`;
  }
  const modelBody = (f) => ({ model: f.get('model'), price_in: f.get('price_in'), price_out: f.get('price_out'), budget: f.get('budget'), max_calls: f.get('max_calls'),
    period: f.get('period'), vision: f.get('vision') === 'on', enabled: f.get('enabled') === 'on', provider: f.get('provider') });
  async function aiSubmit(form) {
    const f = new FormData(form), id = form.dataset.id, kind = form.dataset.ai;
    if (kind === 'budget') { await call('/api/admin/ai/budget', 'PUT', { amount: f.get('amount'), period: f.get('period') }); return 'Budget saved'; }
    if (kind === 'model') { await call('/api/admin/ai/models/' + id, 'PUT', modelBody(f)); return 'Model saved'; }
    if (kind === 'model-new') { await call('/api/admin/ai/models', 'POST', modelBody(f)); return 'Model added'; }
    const body = { name: f.get('name'), kind: f.get('kind'), base_url: f.get('base_url'), api_key: f.get('api_key') };
    if (kind === 'provider') { await call('/api/admin/ai/providers/' + id, 'PUT', body); return 'Provider saved'; }
    await call('/api/admin/ai/providers', 'POST', body); return 'Provider added';
  }
  async function aiAct(b) {
    const form = b.closest('[data-ai]'), id = form.dataset.id, act = b.dataset.aiAct;
    if (act === 'up' || act === 'down') {
      const ids = AI.models.map((m) => m.id), i = ids.indexOf(Number(id)), j = act === 'up' ? i - 1 : i + 1;
      [ids[i], ids[j]] = [ids[j], ids[i]]; await call('/api/admin/ai/order', 'PUT', { ids }); return load();
    }
    if (act === 'test') { b.disabled = true; b.textContent = 'Testing…'; const r = await call(`/api/admin/ai/models/${id}/test`, 'POST'); say(r.ok ? `OK in ${r.ms} ms: "${r.reply}"` : `Failed: ${r.error}`); return load(); }
    if (act === 'del-model') { if (!confirm('Remove this model from the chain? Its spend history goes too.')) return; await call('/api/admin/ai/models/' + id, 'DELETE'); say('Model removed'); return load(); }
    if (act === 'del-provider') { if (!confirm('Delete this provider and all of its models?')) return; await call('/api/admin/ai/providers/' + id, 'DELETE'); say('Provider deleted'); return load(); }
  }

  async function load() {
    try { sessionStorage.setItem('rt-admin', $('#t').value); } catch {}
    try {
      const [st, mem, tg, ai] = await Promise.all([call('/api/admin/stats'), call('/api/admin/members'), call('/api/admin/tags'), call('/api/admin/ai')]);
      AI = ai;
      const mo = mem.month;
      $('#out').innerHTML = `
        <div class="tiles">
          <div class="tile"><b>${st.members}</b><span>members, ${st.newMembers} new this month</span></div>
          <div class="tile"><b>${st.aiMonth}</b><span>AI uses in ${esc(mo)}</span></div>
          <div class="tile"><b>${st.recipes}</b><span>saved recipes</span></div>
          <div class="tile"><b>${st.collections}</b><span>collections</span></div>
          <div class="tile"><b>${st.stock}</b><span>stock items</span></div>
          <div class="tile"><b>${st.bonusLeft}</b><span>bonus uses unspent</span></div>
        </div>

        <section><h2>AI use, last 30 days</h2>${chart(st)}</section>

        ${aiSection(ai)}

        <section>
          <h2>Members</h2>
          <p class="note">Monthly allowance: free ${mem.limits.free}, paid ${mem.limits.paid}. AI stock sorts (also counted in the allowance): free ${mem.featureLimits.sort.free}, paid ${mem.featureLimits.sort.paid}. Bonus uses are spent after the allowance and carry over between months.</p>
          <div class="scroll"><table>
            <thead><tr><th>Member</th><th class="n">Used in ${esc(mo)}</th><th class="n">Bonus left</th><th class="n">Recipes</th><th class="n">Stock</th><th></th></tr></thead>
            <tbody>${mem.members.map((m) => `<tr data-uuid="${esc(m.uuid)}">
              <td>${esc(m.email)}</td>
              <td class="n">${stepper('used', m.used, `AI uses this month for ${m.email}`)}</td>
              <td class="n">${stepper('bonus', m.bonus || 0, `Bonus uses for ${m.email}`)}</td>
              <td class="n">${m.recipes}</td><td class="n">${m.stock}</td>
              <td class="row"><button data-give="50">+50 bonus</button><button class="primary" data-save>Save</button><button data-reset>Reset month</button></td>
            </tr>`).join('') || '<tr><td colspan="6" class="muted">No members have opened their kitchen yet.</td></tr>'}</tbody>
          </table></div>
        </section>

        <section>
          <h2>Stock tags</h2>
          <p class="note">Tags group every member's stock. Members can't edit them; you and (if allowed) the AI can. Icons are SVG: paste a full &lt;svg&gt; (from SVGRepo or anywhere) or just its inner paths on a 24×24 grid. They're shown as one-colour shapes that follow the theme.</p>
          <div class="row" style="margin-bottom:12px"><label for="mode"><b>AI tagging</b></label>
            <select id="mode">${Object.entries(MODES).map(([k, v]) => `<option value="${k}"${tg.mode === k ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
          <div class="tags-grid">${[...tg.tags, { id: '', names: {}, icon: '', source: 'new' }].map((x) => `
            <form class="tag" data-tag="${esc(x.id)}">
              <div>${x.icon ? icon(x.icon) : ''}</div>
              <div>
                ${x.id ? `<div><span class="id">${esc(x.id)}</span> <span class="src">${x.source === 'ai' ? 'created by AI' : 'admin'}</span></div>` : '<input name="id" placeholder="new-tag-id" pattern="[a-z0-9][a-z0-9-]{1,30}" aria-label="New tag id" required>'}
                <div class="names">${LANGS.map((l) => `<input name="${l}" value="${esc(x.names[l] || '')}" placeholder="${l.toUpperCase()} name" aria-label="${l.toUpperCase()} name"${l === 'en' ? ' required' : ''}>`).join('')}</div>
                <textarea name="icon" placeholder="<svg …> or <path d='…'/>" aria-label="Icon SVG" required>${esc(x.icon)}</textarea>
              </div>
              <div class="row" style="flex-direction:column;align-items:stretch">
                <button class="primary">${x.id ? 'Save' : 'Add tag'}</button>
                ${x.id ? '<button type="button" class="danger" data-deltag>Delete</button>' : ''}
              </div>
            </form>`).join('')}</div>
        </section>`;
      wireChart(st);
    } catch (e) { $('#out').innerHTML = `<section>${esc(e.message)}</section>`; }
  }

  $('#f').onsubmit = (e) => { e.preventDefault(); load(); };
  $('#out').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.aiAct) { try { await aiAct(b); } catch (x) { say(x.message); } return; }
    const tr = b.closest('tr[data-uuid]');
    try {
      if (tr) {
        const u = tr.dataset.uuid, val = (n) => tr.querySelector(`[name=${n}]`).value;
        if (b.dataset.step) { const i = b.parentElement.querySelector('input'); i.value = Math.max(0, (Number(i.value) || 0) + Number(b.dataset.step)); return; }
        if (b.dataset.give) { tr.querySelector('[name=bonus]').value = Number(val('bonus')) + Number(b.dataset.give); return; }
        if ('save' in b.dataset) { await call('/api/admin/members/' + u, 'PATCH', { used: val('used'), bonus: val('bonus') }); say('Saved'); return load(); }
        if ('reset' in b.dataset) { await call(`/api/admin/members/${u}/reset`, 'POST'); say('Usage reset'); return load(); }
      }
      if ('deltag' in b.dataset) {
        const id = b.closest('[data-tag]').dataset.tag;
        if (!confirm(`Delete the tag "${id}"? Items with it move to "Other".`)) return;
        await call('/api/admin/tags/' + id, 'DELETE'); say('Tag deleted'); load();
      }
    } catch (x) { say(x.message); }
  });
  $('#out').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.dataset.ai) { try { say(await aiSubmit(e.target)); load(); } catch (x) { say(x.message); } return; }
    const f = new FormData(e.target), id = e.target.dataset.tag || f.get('id');
    try {
      await call('/api/admin/tags/' + encodeURIComponent(id), 'PUT', { names: Object.fromEntries(LANGS.map((l) => [l, f.get(l)])), icon: f.get('icon') });
      say('Tag saved'); load();
    } catch (x) { say(x.message); }
  });
  $('#out').addEventListener('change', async (e) => {
    if (e.target.name === 'preset' && PRESETS[e.target.value]) {
      const [name, kind, url] = PRESETS[e.target.value], f = e.target.form;
      const set = (n, v) => { f.querySelector(`[name=${n}]`).value = v; }; set('name', name); set('kind', kind); set('base_url', url); return;
    }
    if (e.target.id !== 'mode') return;
    try { await call('/api/admin/settings', 'PUT', { ai_tags: e.target.value }); say('AI tagging updated'); } catch (x) { say(x.message); }
  });
  if ($('#t').value) load();
</script>
</body>
</html>
