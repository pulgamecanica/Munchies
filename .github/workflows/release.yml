# On a v* tag (made by `make release`): build multi-arch images to GHCR, then publish a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: Dockerfile }
          - { name: ghost, context: ., file: Dockerfile.ghost }
          - { name: ocr, context: ocr, file: ocr/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Theme zip
        run: make zip
      - name: Release notes
        run: |
          TAG="$GITHUB_REF_NAME"; VERSION="${TAG#v}"; IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TITLE=$TAG: $(make -s release-name)" >> "$GITHUB_ENV"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## Images"
            echo '```sh'
            for s in api ghost ocr; do echo "docker pull $IMAGE-$s:$VERSION"; done
            echo '```'
            echo "Deploy with \`docker-compose.ghcr.yml\` (set \`RECEPEES_VERSION=$VERSION\`), or build from source with \`docker-compose.prod.yml\`."
            echo
            echo "The theme alone is attached as \`recepees-theme.zip\` (Ghost admin → Settings → Design → Upload theme)."
            echo
            echo "## Changes"
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..$TAG"; else git log --no-merges --pretty='- %s' "$TAG"; fi
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file notes.md recepees-theme.zip
