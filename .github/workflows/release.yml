# Releases: whenever main (or a v* tag) has a VERSION (Makefile) that hasn't been released yet,
# build multi-arch images to GHCR and publish a GitHub Release. Bump VERSION + push = release.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(make -s print-version)"; fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then RELEASE=false; else RELEASE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "title=$TAG: $(make -s release-name)" >> "$GITHUB_OUTPUT"
          echo "$TAG already released: $([ $RELEASE = false ] && echo yes, skipping || echo no, releasing)"

  images:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: Dockerfile }
          - { name: ghost, context: ., file: Dockerfile.ghost }
          - { name: ocr, context: ocr, file: ocr/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Theme zip
        run: make zip
      - name: Notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Images"
            echo '```sh'
            for s in api ghost ocr; do echo "docker pull $IMAGE-$s:$VERSION"; done
            echo '```'
            echo "Deploy with \`docker-compose.ghcr.yml\` (\`RECEPEES_VERSION=$VERSION\`), or build from source with \`docker-compose.prod.yml\`."
            echo
            echo "The theme alone is attached as \`recepees-theme.zip\` (Ghost admin → Settings → Design → Upload theme)."
            echo
            echo "## Changes"
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..HEAD"; else git log --no-merges --pretty='- %s'; fi
          } > notes.md
      - name: Publish (creates the tag if it doesn't exist)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md recepees-theme.zip
